services:
  - type: web
    name: Repsandrevenue
    env: python
    plan: starter
    region: frankfurt

    rootDir: .

    buildFilter:
      paths:
        - backend/**
        - frontend/**
        - deploy.sh
        - render.yaml

    # The build command to run
    buildCommand: "./deploy.sh"

    # The start command for the Gunicorn server
    startCommand: "gunicorn --chdir backend growthsource.wsgi"

    # Environment variables
    envVars:
      - key: DATABASE_URL
        # This will be automatically provided by the Render PostgreSQL database
        fromDatabase:
          name: growthsource-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: growthsource.onrender.com
      - key: DEBUG
        value: False

      # Superuser Credentials (set these in the Render dashboard for security)
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

databases:
  - name: growthsource-db
    databaseName: growthsource
    user: growthsource-db
    plan: free
